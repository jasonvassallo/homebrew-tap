name: Claude Code

# @claude MENTION assistant ONLY -- this workflow does NOT auto-review PRs.
# Automatic Claude review is handled solely by claude-code-review.yml (the
# `claude-review` check), so Claude reviews each PR exactly once (was twice --
# this file previously also carried a `pull_request` auto-review trigger).
# It responds only when someone writes "@claude" in a PR comment or a PR
# review comment.
#
# This is the ONLY path with contents: write, so @claude can push a fix or a
# branch when asked. Because it is credential-bearing AND agentic (full
# tools), it is gated three ways: trusted actors only, pull requests only,
# and a fail-closed fork guard that runs before any checkout.
#
# NOTE: this repo is PUBLIC. Plain issues are deliberately NOT a trigger here
# (the fleet-standard `issues: [opened, assigned]` trigger is omitted): issue
# bodies are stranger-authored, and this job runs Claude agentically with
# contents: write, so untrusted issue text must never reach that context.
# Every entry point below is therefore scoped to a pull request.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude:
    # Only trusted actors (OWNER/MEMBER/COLLABORATOR) can invoke @claude, so an
    # untrusted account can never start this credential-bearing job. PR review
    # comments additionally require the PR head to live in this repo — that
    # payload carries head-repo, so the fork guard is declarative there; the
    # issue_comment path resolves the same guard via the API in the first step
    # below (reference: jasonvassallo/dotfiles claude.yml). The
    # `github.event.issue.pull_request` term keeps the issue_comment path from
    # firing on plain (non-PR) issues.
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write        # @claude may be asked to push a fix/branch
      pull-requests: write
      issues: write
      id-token: write        # required by claude-code-action to fetch its OIDC token
      actions: read
    steps:
      # issue_comment payloads carry no PR-head-repo field, so the fork guard
      # is resolved via the API instead. Runs BEFORE checkout so a fork PR's
      # content is never fetched while this job's token is on disk; failing
      # the job is fail-closed.
      - name: Fail closed on fork PRs
        if: ${{ github.event.issue.pull_request }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.issue.pull_request.url }}
        run: |
          head_repo="$(gh api "$PR_URL" --jq '.head.repo.full_name')"
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "PR head is from fork '$head_repo' — refusing to run @claude with credentials." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # claude-code-action's setupBranch runs a plain `git fetch origin` of
          # the PR branch BEFORE it configures its own git auth, so it depends
          # on the credentials actions/checkout persists in .git/config. With
          # persist-credentials: false that fetch dies ("could not read
          # Username for 'https://github.com'") and every run fails. The
          # persisted token is this job's GITHUB_TOKEN (contents: write, so
          # @claude can push a fix/branch), scoped to the job's lifetime.
          persist-credentials: true
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-based commit signing keeps the exchanged app token out of the
          # workspace: without it, tag mode writes the token into the origin
          # remote URL or a helper script, both readable from inside the run.
          # Checkout above persists the job's GITHUB_TOKEN by necessity (see
          # note there); signing ensures the longer-lived app token does not
          # join it on disk.
          use_commit_signing: true
          additional_permissions: |
            actions: read
