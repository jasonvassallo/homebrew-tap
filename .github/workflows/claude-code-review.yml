name: Claude Code Review

# The ONE automatic Claude review per PR (-> the `claude-review` check). Posts
# feedback as inline PR review comments using the repo's CLAUDE.md (if present).
# claude.yml is mention-only and does NOT auto-review, so Claude reviews each PR
# exactly once. Requires the Claude GitHub App + the CLAUDE_CODE_OAUTH_TOKEN
# repo secret.
#
# This path is deliberately the LEAST-PRIVILEGED of the two: contents: read,
# no shell at all, and no ability to push. Anything that needs to write code
# goes through the @claude mention path in claude.yml instead.

on:
  pull_request:
    # reopened + ready_for_review are required by the draft guard below: a PR
    # opened as a draft emits no reviewable event until it is marked ready.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: 'claude-review-${{ github.event.pull_request.number }}'
  cancel-in-progress: true

jobs:
  claude-review:
    # Skip fork PRs: they don't receive repo secrets, so the run would fail.
    # Skip PRs labeled 'trivial': the fleet's review opt-out tier.
    # Skip drafts and dependabot: repo-specific noise guards.
    if: |
      github.event.pull_request.head.repo.fork == false &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      !contains(github.event.pull_request.labels.*.name, 'trivial')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write   # needed to post the review + inline comments
      issues: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@700e7f8316990de46bed556429765647af760efc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # API-based commit signing makes tag mode skip configureGitAuth, so
          # the exchanged app token is never written into the workspace (the
          # non-signing path embeds it in the origin remote URL, readable by
          # the Read tool). The API file-ops tools it switches to are already
          # in the deny list below, so review runs still cannot commit.
          use_commit_signing: true
          # track_progress + the inline-comment tool below post inline review
          # comments (the supported pairing from the @v1 pr-review examples).
          # use_sticky_comment reuses one progress comment across synchronize
          # runs instead of stacking a new one per push (defaults to false).
          track_progress: true
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            The PR branch is checked out in the working directory. Review ONLY
            the changes in this pull request's diff. Focus on:

            1. Correctness — formula Ruby/DSL errors, wrong url/sha256
               pairing, missing or incorrect dependencies, broken install or
               test blocks, and version/livecheck mismatches.
            2. Security — sha256 checksums that don't correspond to the
               declared artifact URL, non-HTTPS download URLs, install steps
               that pipe remote content to a shell, leaked secrets or tokens.
               This project treats security as the highest priority.
            3. Repo conventions — standard Homebrew formula style (should
               pass `brew audit`), and least-privilege defaults.

            Use the repository's CLAUDE.md (if present) for style and
            conventions. Be constructive and concise; skip purely stylistic
            nits and do not restate unchanged code.

            Post specific issues as INLINE review comments on the exact lines.
            Put general observations in your tracking comment. You have no
            shell: read files directly with your file tools.
          # Claude gets NO Bash at all in this job. The OAuth token necessarily
          # lives in the subprocess env, and even "read-only" shell commands
          # (echo/cat/env) could be prompt-injected into echoing it for posting
          # through the comment tools — so the shell itself is the sink, not
          # any particular command. Tag mode already injects Read/Grep/Glob/LS
          # for reviewing the checked-out branch, and persist-credentials:
          # false keeps the git remote token-free. Deny rules win over allow
          # rules, so the git/file-ops write tools tag mode auto-grants are
          # dead code here too.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment"
            --disallowedTools "Bash,mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"
